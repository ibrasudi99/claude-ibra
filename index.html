<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tasks</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --base:    #0F1117;
      --surface: #1A1D27;
      --border:  #252836;
      --accent:  #6C63FF;
      --accent2: #9B95FF;
      --text:    #E2E8F0;
      --muted:   #64748B;
      --done:    #334155;
      --danger:  #FF6B6B;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--base);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 16px 80px;
    }

    .wrap {
      width: 100%;
      max-width: 540px;
    }

    /* Header */
    header {
      margin-bottom: 36px;
    }

    .date-label {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: .06em;
      color: var(--muted);
      margin-bottom: 6px;
    }

    h1 {
      font-size: 28px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.15;
    }

    h1 span {
      color: var(--accent2);
    }

    /* Stats row */
    .stats {
      display: flex;
      gap: 20px;
      margin-top: 16px;
    }

    .stat {
      font-size: 12px;
      color: var(--muted);
    }

    .stat strong {
      color: var(--text);
      font-weight: 500;
    }

    /* Input */
    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 28px;
    }

    input[type="text"] {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      padding: 13px 16px;
      outline: none;
      transition: border-color .15s;
    }

    input[type="text"]::placeholder { color: var(--muted); }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    .add-btn {
      background: var(--accent);
      border: none;
      border-radius: 10px;
      color: #fff;
      cursor: pointer;
      font-family: inherit;
      font-size: 20px;
      font-weight: 300;
      padding: 0 18px;
      transition: background .15s, transform .1s;
      line-height: 1;
    }

    .add-btn:hover { background: var(--accent2); }
    .add-btn:active { transform: scale(.95); }

    /* Filters */
    .filters {
      display: flex;
      gap: 4px;
      margin-bottom: 20px;
    }

    .filter-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      padding: 6px 14px;
      transition: all .15s;
    }

    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .filter-btn:hover:not(.active) {
      border-color: var(--accent);
      color: var(--text);
    }

    /* Task list */
    #task-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .task-item {
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      gap: 14px;
      padding: 14px 16px;
      transition: border-color .15s, opacity .2s;
      animation: slideIn .18s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .task-item.done {
      opacity: .55;
    }

    .task-item:hover {
      border-color: #353848;
    }

    /* Custom checkbox */
    .check-wrap {
      flex-shrink: 0;
      position: relative;
      width: 20px;
      height: 20px;
    }

    .check-wrap input[type="checkbox"] {
      opacity: 0;
      position: absolute;
      inset: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .check-box {
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .15s;
      pointer-events: none;
    }

    .check-wrap input:checked ~ .check-box {
      background: var(--accent);
      border-color: var(--accent);
    }

    .check-box svg {
      display: none;
    }

    .check-wrap input:checked ~ .check-box svg {
      display: block;
    }

    /* Task text */
    .task-text {
      flex: 1;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.45;
      outline: none;
      background: transparent;
      border: none;
      color: inherit;
      font-family: inherit;
      cursor: text;
      word-break: break-word;
    }

    .task-item.done .task-text {
      text-decoration: line-through;
      color: var(--muted);
    }

    /* Delete button */
    .del-btn {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      flex-shrink: 0;
      font-size: 16px;
      opacity: 0;
      padding: 4px;
      transition: color .15s, opacity .15s;
      line-height: 1;
    }

    .task-item:hover .del-btn { opacity: 1; }
    .del-btn:hover { color: var(--danger); }

    /* Empty state */
    .empty {
      text-align: center;
      padding: 48px 0;
      color: var(--muted);
    }

    .empty-icon {
      font-size: 36px;
      margin-bottom: 12px;
    }

    .empty p {
      font-size: 14px;
    }

    /* Clear done */
    .actions {
      margin-top: 20px;
      display: flex;
      justify-content: flex-end;
    }

    .clear-btn {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      padding: 4px 0;
      transition: color .15s;
    }

    .clear-btn:hover { color: var(--danger); }

    @media (max-width: 420px) {
      h1 { font-size: 22px; }
      .stats { gap: 14px; }
    }
  </style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="date-label" id="date-label"></div>
    <h1>My Tasks <span id="pending-badge"></span></h1>
    <div class="stats">
      <div class="stat"><strong id="stat-total">0</strong> total</div>
      <div class="stat"><strong id="stat-done">0</strong> completed</div>
    </div>
  </header>

  <div class="input-row">
    <input type="text" id="task-input" placeholder="Add a new task…" maxlength="200" />
    <button class="add-btn" id="add-btn" aria-label="Add task">+</button>
  </div>

  <div class="filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="active">Active</button>
    <button class="filter-btn" data-filter="done">Done</button>
  </div>

  <div id="task-list"></div>

  <div class="actions">
    <button class="clear-btn" id="clear-btn">Clear completed</button>
  </div>

</div>

<script>
  // ── State ──────────────────────────────────────────────
  let tasks  = JSON.parse(localStorage.getItem('tasks') || '[]');
  let filter = 'all';

  // ── Date label ─────────────────────────────────────────
  const days   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const now    = new Date();
  document.getElementById('date-label').textContent =
    `${days[now.getDay()]}, ${months[now.getMonth()]} ${now.getDate()}`;

  // ── Helpers ────────────────────────────────────────────
  function save() {
    localStorage.setItem('tasks', JSON.stringify(tasks));
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2);
  }

  function addTask(text) {
    text = text.trim();
    if (!text) return;
    tasks.unshift({ id: uid(), text, done: false });
    save();
    render();
  }

  function toggleTask(id) {
    const t = tasks.find(t => t.id === id);
    if (t) { t.done = !t.done; save(); render(); }
  }

  function deleteTask(id) {
    tasks = tasks.filter(t => t.id !== id);
    save();
    render();
  }

  function editTask(id, text) {
    const t = tasks.find(t => t.id === id);
    if (t) { t.text = text; save(); }
  }

  function clearDone() {
    tasks = tasks.filter(t => !t.done);
    save();
    render();
  }

  // ── Render ─────────────────────────────────────────────
  function render() {
    const total   = tasks.length;
    const done    = tasks.filter(t => t.done).length;
    const pending = total - done;

    document.getElementById('stat-total').textContent = total;
    document.getElementById('stat-done').textContent  = done;
    document.getElementById('pending-badge').textContent =
      pending > 0 ? `(${pending})` : '';

    const visible = tasks.filter(t => {
      if (filter === 'active') return !t.done;
      if (filter === 'done')   return  t.done;
      return true;
    });

    const list = document.getElementById('task-list');
    list.innerHTML = '';

    if (visible.length === 0) {
      const msgs = {
        all:    ['✦', 'No tasks yet — add one above.'],
        active: ['✓', 'Nothing left to do!'],
        done:   ['○', 'Nothing completed yet.'],
      };
      const [icon, msg] = msgs[filter];
      list.innerHTML = `
        <div class="empty">
          <div class="empty-icon">${icon}</div>
          <p>${msg}</p>
        </div>`;
      return;
    }

    visible.forEach(t => {
      const item = document.createElement('div');
      item.className = 'task-item' + (t.done ? ' done' : '');
      item.dataset.id = t.id;

      item.innerHTML = `
        <label class="check-wrap" aria-label="Mark done">
          <input type="checkbox" ${t.done ? 'checked' : ''} />
          <div class="check-box">
            <svg width="10" height="8" viewBox="0 0 10 8" fill="none">
              <path d="M1 4L3.5 6.5L9 1" stroke="#fff" stroke-width="1.8"
                    stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </label>
        <div class="task-text" contenteditable="${t.done ? 'false' : 'true'}"
             role="textbox" aria-label="Task text"
             spellcheck="false">${escHtml(t.text)}</div>
        <button class="del-btn" aria-label="Delete task">✕</button>
      `;

      // Checkbox
      item.querySelector('input[type="checkbox"]')
        .addEventListener('change', () => toggleTask(t.id));

      // Inline edit
      const textEl = item.querySelector('.task-text');
      textEl.addEventListener('blur', () => {
        const val = textEl.textContent.trim();
        if (!val) { textEl.textContent = t.text; return; }
        editTask(t.id, val);
      });
      textEl.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); textEl.blur(); }
      });

      // Delete
      item.querySelector('.del-btn')
        .addEventListener('click', () => deleteTask(t.id));

      list.appendChild(item);
    });
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── Events ─────────────────────────────────────────────
  document.getElementById('add-btn').addEventListener('click', () => {
    const inp = document.getElementById('task-input');
    addTask(inp.value);
    inp.value = '';
    inp.focus();
  });

  document.getElementById('task-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      addTask(e.target.value);
      e.target.value = '';
    }
  });

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      filter = btn.dataset.filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    });
  });

  document.getElementById('clear-btn').addEventListener('click', clearDone);

  // ── Init ───────────────────────────────────────────────
  render();
</script>
</body>
</html>
